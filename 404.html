<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/duoverse-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- `viewport-fit=cover` asks for the whole screen, so the app draws under the
       clock instead of iOS keeping that strip and painting it itself. It is also
       what gives `env(safe-area-inset-top)` a height, which is where
       phone_frame's PhoneSafeArea takes the top inset from — no inset is written
       in Dart. Flutter's engine replaces this meta on boot; the MutationObserver
       at the bottom of the body puts `cover` back. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Duoverse — estude as escrituras num caminho estilo Duolingo.">
  <!-- Browser/PWA chrome colour, before Flutter boots; once it has,
       web_page_theme takes over with a single meta and drives it per screen
       (the reading session locks it to its paper colour). On an installed iOS
       PWA it no longer paints the clock's strip — `black-translucent` below
       hands that strip to the app — but it still drives Android Chrome, the
       desktop toolbar and Safari's own bar. -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131F24" media="(prefers-color-scheme: dark)">

  <!-- iOS "Add to Home Screen" (standalone PWA). `black-translucent` is the pair
       of `viewport-fit=cover`: with both, the strip the clock and the battery
       live in becomes the app's — its own background runs up under them and
       there is no band of another colour to match, and iOS draws the clock over
       it. Alone, without `cover`, this is what paints the strip black. With
       `default` iOS keeps the strip and paints it the `theme-color` meta, which
       it reads once at launch and never again — so a user-switchable theme is
       stuck with whichever colour it opened with.
       The opaque lamp icon comes from the apple-touch-icons below. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duoverse">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon: small legacy PNG + high-res variants so the tab icon stays crisp
       on retina (the browser picks the best size). -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png"/>

  <title>Duoverse</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page behind the Flutter view, until Dart sets it per screen. Matches
       the app's background so the strips around the view never flash white.

       `100vh`, NOT `100%`: under `cover`, `100%` does not count the area behind
       the status bar, so the document comes out shorter than the screen and a
       band of background is left along the bottom. And do not add
       `env(safe-area-inset-top)` on top of it — `100vh` is already the whole
       screen, and the extra overshoots, pushing anything anchored to the bottom
       (the nav bar) off the edge. */
    html, body { margin: 0; padding: 0; height: 100vh; background-color: #131F24; }
    @media (prefers-color-scheme: light) {
      html, body { background-color: #FFFFFF; }
    }

    /* Hosts the Flutter view, at the document's own height, so the engine
       measures THIS element (through its ResizeObserver) rather than
       `documentElement.clientHeight` — which under `cover` leaves out the top
       safe area and hands the app a viewport shorter than the screen. */
    #flutter-host { position: fixed; top: 0; left: 0; right: 0; height: 100vh; }

    /* The reading view paints its OWN text selection (a tan pill) and shows its
       own toolbar. Under the Flutter canvas there's a hidden text input, and on
       iOS Safari it otherwise shows the browser's native blue selection and
       long-press callout on top — a duplicate. Hide the native selection and
       disable the callout so only the app's UI shows. Selection/copy still work;
       only the native highlight is made invisible. */
    ::selection { background: transparent !important; }
    ::-moz-selection { background: transparent !important; }
    /* Suppress the browser's native text selection (the iOS blue highlight +
       handles) that leaks through Flutter's hidden text input on top of the
       app's own painted (tan) selection. The reading view drives selection
       through Flutter gestures, not the DOM, so this hides the native visual
       without stopping selection. */
    html, body {
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Flutter sets user-select:text inline on its hidden editing element, which
       is what iOS Safari paints the native blue selection on. Override it with
       !important so the native highlight is suppressed; the reading view's own
       (framework-driven) selection + tan painter keep working. */
    input, textarea, [contenteditable] {
      -webkit-user-select: none !important;
      user-select: none !important;
    }
  </style>

    for a whole extra load after a deploy: a fix can be published and verified
    on the server and still not be what the phone is running. This is for the
    copies installed while there still was a worker — the app they are holding
    cannot fetch itself.

      navigator.serviceWorker.getRegistrations().then(function (all) {
        all.forEach(function (one) { one.unregister(); });
      });
    }
    if (window.caches) {

      });
    }

       own, which has no `viewport-fit` — and it measures the page right after,
       during initialization, so putting it back from Dart is too late. This
       puts `cover` back the moment the engine's meta appears. */

      var m = document.querySelector('meta[name="viewport"]');
      if (m && m.content.indexOf('viewport-fit') === -1) {
        m.content += ', viewport-fit=cover';
      }
    }).observe(document.head, {childList: true, subtree: true, attributes: true});
  </script>
